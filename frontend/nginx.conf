server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限，与网关的 app.max-upload-bytes 保持一致
    client_max_body_size 20m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP：script-src 不含 unsafe-inline，是挡「报告里的注入脚本被执行」的最后一道闸。
    # 报告内容是 LLM 基于抓取到的任意网页生成的，会经 v-html 渲染 —— 前端那层用
    # DOMPurify 清洗，这里再加一道。Vue 生产构建是 runtime-only，不用 eval/new Function。
    # img-src 放开 https: 是因为报告可能引用外部图片。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # HSTS 只在 HTTPS 下有意义，浏览器也会忽略 HTTP 响应里的它。
    # 配好 TLS（listen 443 ssl）之后再打开这一行：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vue 静态文件
    location / {
        try_files $uri /index.html;
    }

    # API → Java 网关（含 SSE 流式）
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 必须显式转发来源信息：缺了这几行，网关看到的所有请求都来自 nginx 容器 IP，
        # 于是「日志里无法溯源」和「按 IP 限流退化成全站共用一个桶」会同时发生
        # （AuthRateLimiter 就是按 X-Forwarded-For 取客户端 IP 的）。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 这里原先有一条 location /kb/ { proxy_pass http://agent:8000; }。
    # 已删除：Python Agent 自身没有任何认证，它的 user_id 是由调用方以 URL 查询
    # 参数传入的 —— 那条转发等于把「列出 / 上传 / 删除任意用户知识库」直接暴露给
    # 任何能访问站点的人，多租户隔离形同虚设。
    # 知识库现在统一走 /api/kb/*，由网关按 JWT 注入 user_id。
}
