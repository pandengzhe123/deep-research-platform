[project]
name = "my-deep-researcher"
version = "0.1.0"
description = "从零构建的深度研究智能体 —— Level 1 → Level 4 渐进实现"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=2.0",
    "ddgs>=9.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "jieba>=0.42",
    "rank-bm25>=0.2",
    "redis>=8.1.0",
    # 以下三项原先只写在 Dockerfile 里 → `pip install -e .` 路径下缺失：
    #   python-multipart: server.py 用 UploadFile，FastAPI 建路由时若无此包直接 RuntimeError
    #   pymupdf / python-docx: kb.read_file() 解析 PDF / DOCX（函数内惰性 import）
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
