services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: deepresearch
      POSTGRES_DB: deepresearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 60s

  # 热数据层：搜索缓存 / URL 去重 / 会话研究锁 / 上下文热层 / 用量限流
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent:
    build: ./agent
    ports:
      - "8000:8000"
    environment:
      # 容器内不能用 localhost 连 Redis（那是容器自己）
      - REDIS_URL=redis://redis:6379/0
    # 真实 API Key 从 agent/.env 注入；文件不存在也能起（required: false），
    # 这样「clone 后直接 docker compose up」不再需要先手动 cp .env.example
    env_file:
      - path: ./agent/.env
        required: false
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

  gateway:
    build: ./java-gateway
    ports:
      - "8080:8080"
    environment:
      - AGENT_URL=http://agent:8000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deepresearch
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
      - agent

volumes:
  pgdata:
